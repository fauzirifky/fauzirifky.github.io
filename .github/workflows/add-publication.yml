name: Add publication

on:
  workflow_dispatch:
    inputs:
      title:
        description: Publication title
        required: true
        type: string
      authors:
        description: Authors
        required: true
        type: string
      venue:
        description: Journal / proceedings / volume / pages
        required: true
        type: string
      year:
        description: Publication year
        required: true
        type: string
      url:
        description: DOI, publisher, or Google Scholar URL
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  add-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add or update publication
        env:
          PUB_TITLE: ${{ inputs.title }}
          PUB_AUTHORS: ${{ inputs.authors }}
          PUB_VENUE: ${{ inputs.venue }}
          PUB_YEAR: ${{ inputs.year }}
          PUB_URL: ${{ inputs.url }}
        run: python3 scripts/add_publication.py

      - name: Commit changes
        id: commit
        env:
          PUB_TITLE: ${{ inputs.title }}
        run: |
          if git diff --quiet -- src/data/publications.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication change was necessary."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          git commit -m "Update publication: ${PUB_TITLE}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
